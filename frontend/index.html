<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/vt323.woff2" as="font" type="font/woff2" crossorigin />
    <title>🐝 Colmeia — Custom Models</title>
    <script>
      // aplica o tema salvo antes da renderização (padrão: escuro)
      (function () {
        var t = localStorage.getItem('colmeia_tema') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
