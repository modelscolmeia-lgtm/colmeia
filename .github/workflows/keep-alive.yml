name: keep-alive

# Mantém o backend do Render "acordado" pingando a API a cada ~10 min durante as horas
# ativas (evita o cold start de ~30-50s do plano free). Fora dessa janela ele hiberna,
# o que preserva as horas grátis do Render (750h/mês).
#
# Janela: ~09h às 03h no horário de Brasília (BRT = UTC-3), ou seja 12h–06h UTC.
on:
  schedule:
    - cron: '*/10 12-23 * * *'
    - cron: '*/10 0-5 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: curl -sS -m 60 https://colmeia.onrender.com/api > /dev/null || true
